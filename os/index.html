<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>DCB OS</title>
<style>
:root{
  --bg:#0b0d10; --panel:#14181d; --panel2:#1c2229;
  --gold:#e6b84a; --text:#f5f7f8; --muted:#9aa4ad; --line:#2d353e;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
button{font:inherit}
#app{height:100dvh;display:flex;flex-direction:column;background:#000}
header{
  height:58px;flex:0 0 auto;background:linear-gradient(#11161b,#0c1014);
  display:flex;align-items:center;justify-content:space-between;padding:0 12px;
  border-bottom:1px solid var(--line);z-index:5
}
.brand{font-weight:900;letter-spacing:.04em}
.brand b{color:var(--gold)}
.tag{font-size:11px;color:var(--muted);letter-spacing:.13em}
.install{border:1px solid var(--gold);background:transparent;color:var(--gold);border-radius:10px;padding:7px 10px;font-weight:800;display:none}
.stage{position:relative;flex:1;min-height:0;background:#000;touch-action:none;overflow:hidden}
.slide{position:absolute;inset:0;display:none;align-items:center;justify-content:center}
.slide.active{display:flex}
.slide img{width:100%;height:100%;object-fit:contain;background:#000;pointer-events:none;user-select:none}
.badge{
  position:absolute;top:12px;left:12px;background:rgba(0,0,0,.68);
  border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 11px;
  font-weight:850;font-size:12px;letter-spacing:.08em;z-index:3
}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.navbtn{
  position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:44px;height:64px;
  border:0;background:rgba(0,0,0,.42);color:white;font-size:30px;border-radius:12px
}
#prev{left:7px} #next{right:7px}
.tools{
  flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);
  padding:7px 7px calc(7px + env(safe-area-inset-bottom));display:grid;
  grid-template-columns:repeat(6,1fr);gap:6px
}
.tool{
  min-height:48px;border:1px solid var(--line);background:var(--panel2);color:white;
  border-radius:11px;font-size:11px;font-weight:800;padding:5px 2px
}
.tool.active{border-color:var(--gold);color:var(--gold)}
.film{
  height:60px;flex:0 0 auto;background:#101419;border-top:1px solid var(--line);
  display:flex;gap:7px;align-items:center;padding:6px 8px;overflow-x:auto
}
.thumb{
  height:46px;min-width:70px;border:2px solid transparent;border-radius:7px;overflow:hidden;
  background:#222;position:relative
}
.thumb.active{border-color:var(--gold)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb span{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.58);font-size:8px;padding:2px;text-align:center}
#toast{
  position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:10;
  background:rgba(15,18,22,.92);border:1px solid var(--line);border-radius:999px;
  padding:9px 14px;font-size:12px;display:none;white-space:nowrap
}
.compareWrap{position:absolute;inset:0;display:none;z-index:8;background:#000}
.compareWrap.show{display:block}
.compareWrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#afterClip{clip-path:inset(0 50% 0 0)}
#compareRange{position:absolute;left:8%;right:8%;bottom:20px;width:84%;z-index:9}
@media (min-width:700px){
  header{height:66px;padding:0 18px}.brand{font-size:21px}.film{height:76px}.thumb{height:61px;min-width:96px}
  .tools{grid-template-columns:repeat(8,1fr);padding:8px 12px}.tool{min-height:52px;font-size:12px}
}
</style>
</head>
<body>
<div id="app">
<header>
  <div>
    <div class="brand"><b>DCB</b> OS</div>
    <div class="tag">DESIGN • CREATE • BUILD</div>
  </div>
  <button id="installBtn" class="install">INSTALL</button>
</header>

<div class="stage" id="stage">
  <div class="slide active" data-title="BEFORE"><img src="before.jpg" alt="Before"></div>
  <div class="slide" data-title="AFTER"><img src="after.jpg" alt="After"></div>
  <div class="badge" id="badge">BEFORE • 1/2</div>
  <canvas id="draw"></canvas>
  <button class="navbtn" id="prev">‹</button>
  <button class="navbtn" id="next">›</button>

  <div class="compareWrap" id="compare">
    <img src="before.jpg" alt="">
    <img src="after.jpg" id="afterClip" alt="">
    <input type="range" id="compareRange" min="0" max="100" value="50">
  </div>
  <div id="toast"></div>
</div>

<div class="film" id="film">
  <div class="thumb active" data-i="0"><img src="before.jpg"><span>BEFORE</span></div>
  <div class="thumb" data-i="1"><img src="after.jpg"><span>AFTER</span></div>
</div>

<div class="tools">
  <button class="tool active" id="drawBtn">✏ DRAW</button>
  <button class="tool" id="eraseBtn">⌫ ERASE</button>
  <button class="tool" id="clearBtn">CLEAR</button>
  <button class="tool" id="compareBtn">↔ COMPARE</button>
  <button class="tool" id="playBtn">▶ STORY</button>
  <button class="tool" id="saveBtn">💾 SAVE</button>
</div>
</div>

<script>
const slides=[...document.querySelectorAll('.slide')], thumbs=[...document.querySelectorAll('.thumb')];
const badge=document.getElementById('badge'), stage=document.getElementById('stage');
const canvas=document.getElementById('draw'), ctx=canvas.getContext('2d');
const compare=document.getElementById('compare'), range=document.getElementById('compareRange'), afterClip=document.getElementById('afterClip');
const toast=document.getElementById('toast');
let current=0, mode='draw', drawing=false, last=null, playTimer=null, deferredPrompt=null;

function fitCanvas(){
  const dpr=window.devicePixelRatio||1, r=stage.getBoundingClientRect();
  const old=canvas.toDataURL();
  canvas.width=Math.floor(r.width*dpr); canvas.height=Math.floor(r.height*dpr);
  canvas.style.width=r.width+'px'; canvas.style.height=r.height+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(old && old.length>30){ const im=new Image(); im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height); im.src=old; }
}
window.addEventListener('resize',fitCanvas); setTimeout(fitCanvas,100);

function show(i){
  current=(i+slides.length)%slides.length;
  slides.forEach((s,n)=>s.classList.toggle('active',n===current));
  thumbs.forEach((t,n)=>t.classList.toggle('active',n===current));
  badge.textContent=`${slides[current].dataset.title} • ${current+1}/${slides.length}`;
  compare.classList.remove('show'); badge.style.display='block'; canvas.style.display='block';
}
document.getElementById('prev').onclick=()=>show(current-1);
document.getElementById('next').onclick=()=>show(current+1);
thumbs.forEach(t=>t.onclick=()=>show(+t.dataset.i));

let sx=0, sy=0;
stage.addEventListener('touchstart',e=>{
  if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY}
},{passive:true});
stage.addEventListener('touchend',e=>{
  if(!e.changedTouches.length)return;
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.4 && !drawing) show(current+(dx<0?1:-1));
},{passive:true});

function pt(e){
  const r=canvas.getBoundingClientRect(), p=e.touches?e.touches[0]:e;
  return {x:p.clientX-r.left,y:p.clientY-r.top}
}
function start(e){if(compare.classList.contains('show'))return; drawing=true; last=pt(e); e.preventDefault()}
function move(e){
  if(!drawing)return; const p=pt(e); ctx.lineCap='round';ctx.lineJoin='round';
  if(mode==='erase'){ctx.globalCompositeOperation='destination-out';ctx.lineWidth=26}
  else{ctx.globalCompositeOperation='source-over';ctx.strokeStyle='#ffcc3a';ctx.lineWidth=4}
  ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;e.preventDefault()
}
function end(){drawing=false;last=null;ctx.globalCompositeOperation='source-over'}
canvas.addEventListener('pointerdown',start);canvas.addEventListener('pointermove',move);
canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);

function activeTool(id){
  document.querySelectorAll('.tool').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active')
}
drawBtn.onclick=()=>{mode='draw';activeTool('drawBtn')};
eraseBtn.onclick=()=>{mode='erase';activeTool('eraseBtn')};
clearBtn.onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height);

compareBtn.onclick=()=>{
  compare.classList.toggle('show');
  badge.style.display=compare.classList.contains('show')?'none':'block';
  canvas.style.display=compare.classList.contains('show')?'none':'block';
}
range.oninput=()=>afterClip.style.clipPath=`inset(0 ${100-range.value}% 0 0)`;

playBtn.onclick=()=>{
  if(playTimer){clearInterval(playTimer);playTimer=null;playBtn.textContent='▶ STORY';return}
  playBtn.textContent='■ STOP'; show(0);
  playTimer=setInterval(()=>{ if(current===slides.length-1){clearInterval(playTimer);playTimer=null;playBtn.textContent='▶ STORY'} else show(current+1)},1500);
};

function say(msg){toast.textContent=msg;toast.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>toast.style.display='none',1800)}
saveBtn.onclick=()=>{localStorage.setItem('dcb-drawing',canvas.toDataURL());say('Project saved on this device')};

const saved=localStorage.getItem('dcb-drawing');
if(saved){const im=new Image();im.onload=()=>{fitCanvas();const r=canvas.getBoundingClientRect();ctx.drawImage(im,0,0,r.width,r.height)};im.src=saved}

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.style.display='block'});
installBtn.onclick=async()=>{if(!deferredPrompt){say('Chrome menu → Install app / Add to Home screen');return} deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.style.display='none'};
window.addEventListener('appinstalled',()=>say('DCB OS installed'));

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
