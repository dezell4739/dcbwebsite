<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DCB OS — AI Design Engine</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#07090c;
  color:#f7f9fb;
  font-family:Arial,sans-serif;
}

header{
  padding:16px;
  border-bottom:1px solid #29303a;
  font-weight:900;
}

main{
  display:grid;
  grid-template-columns:1fr 360px;
  min-height:90vh;
}

.stage,.panel{
  padding:18px;
}

.panel{
  border-left:1px solid #29303a;
}

.viewer{
  background:#10151b;
  border:1px solid #29303a;
  border-radius:16px;
  min-height:420px;
  display:grid;
  place-items:center;
  position:relative;
  overflow:hidden;
}

.viewer img{
  max-width:100%;
  max-height:70vh;
}

.badge{
  position:absolute;
  top:12px;
  left:12px;
  background:#000c;
  padding:7px 10px;
  border-radius:20px;
  z-index:2;
}

.tabs{
  display:flex;
  gap:8px;
  margin-top:12px;
  overflow:auto;
}

.tabs button{
  background:#151b22;
  color:white;
  border:1px solid #39424e;
  border-radius:10px;
  padding:10px;
}

.tabs .active{
  color:#f2b632;
  border-color:#f2b632;
}

textarea{
  width:100%;
  min-height:140px;
  background:#151b22;
  color:white;
  border:1px solid #39424e;
  border-radius:12px;
  padding:12px;
  font-size:16px;
}

.generate{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#f2b632;
  color:#111;
  font-weight:900;
  cursor:pointer;
}

.generate:disabled{
  opacity:.5;
}

.status{
  margin-top:14px;
  color:#aeb7c2;
}

@media(max-width:850px){
  main{grid-template-columns:1fr}
  .panel{
    border-left:0;
    border-top:1px solid #29303a;
  }
}
</style>
</head>

<body>

<header>
DCB OS &nbsp; | &nbsp; DESIGN → CREATE → BUILD
</header>

<main>

<section class="stage">

<div class="viewer">
  <span class="badge" id="badge">BEFORE</span>
  <img id="mainImage" src="./before.jpg" alt="DCB Project">
</div>

<div class="tabs" id="tabs">

<button
class="active"
data-src="./before.jpg"
data-label="BEFORE">
BEFORE
</button>

<button
data-src="./after.jpg"
data-label="REAL AFTER">
REAL AFTER
</button>

</div>

</section>


<aside class="panel">

<h2>Jarvis — AI Design</h2>

<p>
Tell Jarvis what you want to see.
This sends a real request to the DCB OS backend.
</p>

<textarea
id="instruction"
placeholder="Example: Design a 12×16 heavy-timber pavilion with a dark metal roof, heavy posts and stone bases.">
</textarea>

<button
class="generate"
id="generate">
GENERATE DESIGN
</button>

<div
class="status"
id="status">
Ready.
</div>

</aside>

</main>


<script>

const image =
document.getElementById("mainImage");

const badge =
document.getElementById("badge");

const tabs =
document.getElementById("tabs");


tabs.addEventListener("click",function(event){

  const button = event.target;

  if(!button.dataset.src){
    return;
  }

  image.src =
  button.dataset.src;

  badge.textContent =
  button.dataset.label;

  const buttons =
  tabs.querySelectorAll("button");

  buttons.forEach(function(item){
    item.classList.remove("active");
  });

  button.classList.add("active");

});


document
.getElementById("generate")
.addEventListener("click",async function(){

  const instruction =
  document
  .getElementById("instruction")
  .value
  .trim();

  const status =
  document.getElementById("status");

  const generateButton =
  document.getElementById("generate");


  if(!instruction){

    status.textContent =
    "Tell Jarvis what to design first.";

    return;
  }


  generateButton.disabled = true;

  status.textContent =
  "Jarvis is generating a real AI design...";


  try{

    const response =
    await fetch(
      "/.netlify/functions/design",
      {
        method:"POST",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({
          instruction:instruction
        })
      }
    );


    const data =
    await response.json();


    if(!response.ok || !data.ok){

      throw new Error(
        data.error ||
        "Design request failed."
      );

    }


    let imageSource = null;


    if(data.image){

      imageSource =
      "data:image/png;base64," +
      data.image;

    }
    else if(data.url){

      imageSource =
      data.url;

    }


    if(!imageSource){

      throw new Error(
        "The AI returned no image."
      );

    }


    const newButton =
    document.createElement("button");

    newButton.textContent =
    "AI DESIGN";

    newButton.dataset.src =
    imageSource;

    newButton.dataset.label =
    "AI DESIGN";


    tabs.appendChild(
      newButton
    );


    newButton.click();


    status.textContent =
    "AI design generated successfully.";


  }
  catch(error){

    status.textContent =
    "ERROR: " +
    error.message;

  }
  finally{

    generateButton.disabled =
    false;

  }

});

</script>

</body>
</html>
